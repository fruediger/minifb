# DISCLAIMER: This source file was 100% generated by AI (Claude Sonnet 5 via GitHub Copilot)
#
# Manual-only helper workflow: builds MiniFB as a SHARED library (with tests and
# examples) across a platform/backend matrix, then builds and runs a tiny standalone
# consumer program that links the produced shared library and checks
# mfb_get_version_variant() against the expected value for that build.
#
# This workflow is NOT meant to ever be merged/enabled upstream. It only exists as a
# local sanity check that a shared-library build still works after recent changes.

name: Shared Library Build Test (manual)

on:
  workflow_dispatch:
  push: # This is just here to make the workflow visible. Once the workflow ran once, it can be removed as the workflow should now be visible.

jobs:
  build-and-smoke-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            cmake_args: ""
            expected_variant: "windows-opengl"

          - name: Linux X11
            os: ubuntu-latest
            cmake_args: "-DMINIFB_USE_WAYLAND_API=OFF -DMINIFB_USE_OPENGL_API=OFF"
            expected_variant: "linux"

          - name: Linux OpenGL
            os: ubuntu-latest
            cmake_args: "-DMINIFB_USE_WAYLAND_API=OFF -DMINIFB_USE_OPENGL_API=ON"
            expected_variant: "linux-opengl"

          - name: Linux Wayland
            os: ubuntu-latest
            cmake_args: "-DMINIFB_USE_WAYLAND_API=ON"
            expected_variant: "linux-wayland"

          - name: macOS
            os: macos-latest
            cmake_args: "-DMINIFB_USE_METAL_API=OFF"
            expected_variant: "macos"

          - name: macOS Metal
            os: macos-latest
            cmake_args: "-DMINIFB_USE_METAL_API=ON"
            expected_variant: "macos-metal"

          - name: macOS Inverted Y
            os: macos-latest
            cmake_args: "-DMINIFB_USE_METAL_API=OFF -DMINIFB_USE_INVERTED_Y_ON_MACOS=ON"
            expected_variant: "macos-invertedy"

          - name: macOS Metal + Inverted Y
            os: macos-latest
            cmake_args: "-DMINIFB_USE_METAL_API=ON -DMINIFB_USE_INVERTED_Y_ON_MACOS=ON"
            expected_variant: "macos-metal-invertedy"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # X11/OpenGL backends (also covers the plain X11/XImage entry, which shares the
      # same dependency set minus actually enabling MINIFB_USE_OPENGL_API).
      - name: Install Linux dependencies (X11 / OpenGL backend)
        if: runner.os == 'Linux' && !contains(matrix.cmake_args, 'WAYLAND_API=ON')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libxrandr-dev

      - name: Install Linux dependencies (Wayland backend)
        if: runner.os == 'Linux' && contains(matrix.cmake_args, 'WAYLAND_API=ON')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            libdecor-0-dev

      - name: Configure MiniFB (shared library, tests, examples, runtime version)
        shell: bash
        run: >
          cmake -B build -S .
          -DMINIFB_BUILD_SHARED=ON
          -DMINIFB_BUILD_TESTS=ON
          -DMINIFB_BUILD_EXAMPLES=ON
          -DMINIFB_USE_RUNTIME_VERSION=ON
          ${{ matrix.cmake_args }}

      - name: Build MiniFB
        run: cmake --build build --config Release --parallel

      - name: Install MiniFB into a staging prefix
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install-prefix"

      # The consumer program is built separately, on its own, against the shared
      # library that was just installed above - never as part of the main build.
      - name: Configure shared-library consumer smoke test
        shell: bash
        run: >
          cmake -B smoke-build -S .github/workflows/shared-lib-build-test
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix"
          -DEXPECTED_VERSION_VARIANT="${{ matrix.expected_variant }}"

      - name: Build shared-library consumer smoke test
        run: cmake --build smoke-build --config Release

      - name: Install shared-library consumer smoke test
        run: cmake --install smoke-build --config Release --prefix "${{ github.workspace }}/smoke-install"

      - name: Make installed shared library loadable at runtime
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows)
              echo "${{ github.workspace }}/install-prefix/bin" >> "$GITHUB_PATH"
              ;;
            macOS)
              echo "DYLD_LIBRARY_PATH=${{ github.workspace }}/install-prefix/lib:$DYLD_LIBRARY_PATH" >> "$GITHUB_ENV"
              ;;
            Linux)
              echo "LD_LIBRARY_PATH=${{ github.workspace }}/install-prefix/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Run shared-library consumer smoke test
        shell: bash
        run: |
          set -e
          bin=$(find "${{ github.workspace }}/smoke-install/bin" -type f | head -n1)
          echo "Running: $bin"
          "$bin"
