name: Window title test

on:
  workflow_dispatch:

jobs:
  window-title:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            exe: build/tests/Debug/window_title_test.exe
          - name: Linux X11
            os: ubuntu-latest
            exe: build/tests/window_title_test
            cmake_args: -DMINIFB_USE_WAYLAND_API=OFF
          - name: Linux Wayland (no libdecor)
            os: ubuntu-latest
            exe: build/tests/window_title_test
            cmake_args: -DMINIFB_USE_WAYLAND_API=ON
            wayland: true
            libdecor: false
          - name: Linux Wayland (libdecor)
            os: ubuntu-latest
            exe: build/tests/window_title_test
            cmake_args: -DMINIFB_USE_WAYLAND_API=ON
            wayland: true
            libdecor: true
          - name: macOS
            os: macos-latest
            exe: build/tests/window_title_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux X11 dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.wayland
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libx11-dev libxrandr-dev libxkbcommon-dev libgl1-mesa-dev xvfb

      - name: Install Linux Wayland dependencies
        if: matrix.wayland
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config libwayland-dev wayland-protocols libxkbcommon-dev weston

      - name: Install libdecor
        if: matrix.wayland && matrix.libdecor
        run: sudo apt-get install -y libdecor-0-dev

      - name: Remove libdecor
        if: matrix.wayland && !matrix.libdecor
        run: |
          sudo apt-get remove -y libdecor-0-dev || true
          if pkg-config --exists libdecor-0; then
            echo "libdecor development files are still installed" >&2
            exit 1
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMINIFB_BUILD_TESTS=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Debug

      - name: Run (Windows / macOS)
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: ./${{ matrix.exe }}

      - name: Run (Linux X11)
        if: matrix.os == 'ubuntu-latest' && !matrix.wayland
        run: xvfb-run -a ./${{ matrix.exe }}

      - name: Run (Linux Wayland)
        if: matrix.wayland
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-test --idle-time=0 &
          WESTON_PID=$!
          for i in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/wayland-test" ] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-test
          status=0
          ./${{ matrix.exe }} || status=$?
          kill $WESTON_PID || true
          exit $status
